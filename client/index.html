<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Publications</title>
</head>
<body>
    <h1>Publications</h1>
    <button id="load-posts" type="button">Charger les publications</button>
    <p id="status" role="status"></p>
    <ul id="posts"></ul>

    <script>
        const API_URL = 'http://127.0.0.1:3000/api/posts';
        const loadButton = document.getElementById('load-posts');
        const status = document.getElementById('status');
        const list = document.getElementById('posts');

        async function loadPosts() {
            loadButton.disabled = true;
            status.textContent = 'Chargement…';
            list.replaceChildren();

            try {
                const response = await fetch(API_URL);

                if (!response.ok) {
                    throw new Error(`Erreur HTTP ${response.status}`);
                }

                const posts = await response.json();

                for (const post of posts) {
                    const item = document.createElement('li');
                    const title = document.createElement('h2');
                    const body = document.createElement('p');

                    title.textContent = post.title;
                    body.textContent = post.body;
                    item.append(title, body);
                    list.append(item);
                }

                status.textContent = `${posts.length} publications chargées.`;
            } catch (error) {
                status.textContent = `Impossible de charger les publications. ${error.message}`;
            } finally {
                loadButton.disabled = false;
            }
        }

        loadButton.addEventListener('click', loadPosts);
    </script>
</body>
</html>
